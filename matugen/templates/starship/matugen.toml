# Generated by Matugen - do not edit manually.
add_newline = false

format = """
$cmd_duration 󰜥 $directory $git_branch
$character"""

[character]
success_symbol = "[   ](bold fg:{{colors.primary.default.hex}})"
error_symbol = "[   ](bold fg:{{colors.error.default.hex}})"

[package]
disabled = true

[git_branch]
style = "bg:{{colors.secondary.default.hex}} fg:{{colors.on_secondary.default.hex}}"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = "󰜥 [](bold fg:{{colors.secondary.default.hex}})[$symbol $branch(:$remote_branch)](bg:{{colors.secondary.default.hex}} fg:{{colors.on_secondary.default.hex}})[ ](bold fg:{{colors.secondary.default.hex}})"

[directory]
home_symbol = "  "
read_only = "  "
style = "bg:{{colors.primary_container.default.hex}} fg:{{colors.on_primary_container.default.hex}}"
truncation_length = 6
truncation_symbol = " ••/"
format = "[](bold fg:{{colors.primary_container.default.hex}})[󰉋 $path]($style)[](bold fg:{{colors.primary_container.default.hex}})"

[cmd_duration]
min_time = 0
format = "[](bold fg:{{colors.tertiary.default.hex}})[󰪢 $duration](bold bg:{{colors.tertiary.default.hex}} fg:{{colors.on_tertiary.default.hex}})[](bold fg:{{colors.tertiary.default.hex}})"

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "
